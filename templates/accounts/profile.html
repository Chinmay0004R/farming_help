{% extends 'base.html' %}
{% load i18n %}

{% block title %}Profile — FarmApp{% endblock %}

{% block content %}
<div class="page-header">
    <h1>👤 {% trans "My Profile" %}</h1>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <span class="form-error">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% trans "Save Changes" %}</button>
        </div>
    </form>
</div>
{% endblock %}
