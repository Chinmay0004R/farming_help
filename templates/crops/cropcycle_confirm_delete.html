{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">Delete Crop Cycle</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to delete this crop cycle?</p>
                <div class="mb-4">
                    <strong>Crop:</strong> {{ cycle.crop.name }}<br>
                    <strong>Plot:</strong> {{ cycle.plot.name }}<br>
                    <strong>Season:</strong> {{ cycle.season }}
                </div>
                <p class="text-danger">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'cropcycle_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
